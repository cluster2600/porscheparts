<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" style="width:100%;height:auto;display:block" viewBox="0 0 1500 960" role="img" aria-labelledby="title description">
  <title id="title">From reference to manufacturing handover</title>
  <desc id="description">Three input routes feed six stages: editable geometry, surface, mechanics, supports, layers and handover. Each stage retains its files and checks. Workshop feedback after printing informs a new revision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#386b68"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#20363d}
      .title{font-size:38px;font-weight:700;letter-spacing:-.6px}
      .subtitle{font-size:22px;fill:#53676b}
      .input{fill:#e9eff1;stroke:#cbd9dc;stroke-width:1.5}
      .input-label{font-size:23px;font-weight:600;text-anchor:middle}
      .card{fill:white;stroke:#cbd9dc;stroke-width:1.5}
      .number{font-size:24px;font-weight:700;fill:white;text-anchor:middle}
      .heading{font-size:27px;font-weight:700}
      .tool{font-size:20px;fill:#386b68;font-weight:600}
      .body{font-size:21px}
      .label{font-size:17px;fill:#6a7c80;letter-spacing:1px}
      .flow{fill:none;stroke:#386b68;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="960" fill="#f4f6f4"/>
  <rect x="0" y="0" width="1500" height="12" fill="#386b68"/>
  <text x="55" y="78" class="title">From reference to manufacturing handover</text>
  <text x="55" y="115" class="subtitle">Working example: 993 Turbo carrier · current master: 1.274798 kg · limit: 1.30 kg</text>

  <rect x="55" y="151" width="430" height="58" rx="13" class="input"/>
  <rect x="535" y="151" width="430" height="58" rx="13" class="input"/>
  <rect x="1015" y="151" width="430" height="58" rx="13" class="input"/>
  <text x="270" y="187" class="input-label">Images + reference scale</text>
  <text x="750" y="187" class="input-label">3D scan + units + orientation</text>
  <text x="1230" y="187" class="input-label">Drawing + axes + dimensions</text>
  <path d="M750 209V232H270V251 M1230 209V232H750 M270 209V251" class="flow"/>

  <g transform="translate(55 265)">
    <rect width="430" height="230" rx="17" class="card"/>
    <circle cx="39" cy="41" r="21" fill="#386b68"/><text x="39" y="49" class="number">1</text>
    <text x="75" y="49" class="heading">Editable geometry</text>
    <text x="26" y="90" class="tool">build123d / OCCT · PicoGK</text>
    <text x="26" y="129" class="label">KEEP</text>
    <text x="26" y="156" class="body">Source, parameters and CAD master</text>
    <text x="26" y="190" class="body">Check axes, dimensions, solid, mass</text>
    <text x="26" y="216" class="body">Record adopted dimensions</text>
  </g>
  <path d="M490 380H523" class="flow"/>
  <g transform="translate(535 265)">
    <rect width="430" height="230" rx="17" class="card"/>
    <circle cx="39" cy="41" r="21" fill="#386b68"/><text x="39" y="49" class="number">2</text>
    <text x="75" y="49" class="heading">Surface and triangles</text>
    <text x="26" y="90" class="tool">PyMesh · Gmsh · CGAL · libigl</text>
    <text x="26" y="129" class="label">KEEP</text>
    <text x="26" y="156" class="body">Revised STL and before/after report</text>
    <text x="26" y="190" class="body">Closure, intersections and quality</text>
    <text x="26" y="216" class="body">Measure distance to the CAD master</text>
  </g>
  <path d="M970 380H1003" class="flow"/>
  <g transform="translate(1015 265)">
    <rect width="430" height="230" rx="17" class="card"/>
    <circle cx="39" cy="41" r="21" fill="#386b68"/><text x="39" y="49" class="number">3</text>
    <text x="75" y="49" class="heading">Mechanical calculations</text>
    <text x="26" y="90" class="tool">Gmsh C3D10 · CalculiX</text>
    <text x="26" y="129" class="label">KEEP</text>
    <text x="26" y="156" class="body">Loads, mounts, material and fields</text>
    <text x="26" y="190" class="body">Compare stress and displacement</text>
    <text x="26" y="216" class="body">Audit energy and mesh sensitivity</text>
  </g>
  <path d="M1230 505V561" class="flow"/>

  <g transform="translate(1015 575)">
    <rect width="430" height="230" rx="17" class="card"/>
    <circle cx="39" cy="41" r="21" fill="#386b68"/><text x="39" y="49" class="number">4</text>
    <text x="75" y="49" class="heading">Orientation and supports</text>
    <text x="26" y="90" class="tool">PySLM · PyMesh / CGAL</text>
    <text x="26" y="129" class="label">KEEP</text>
    <text x="26" y="156" class="body">Pose, envelopes and actual surfaces</text>
    <text x="26" y="190" class="body">Coverage, contacts and confinement</text>
    <text x="26" y="216" class="body">Retain evidence and verdicts</text>
  </g>
  <path d="M1005 690H977" class="flow"/>
  <g transform="translate(535 575)">
    <rect width="430" height="230" rx="17" class="card"/>
    <circle cx="39" cy="41" r="21" fill="#386b68"/><text x="39" y="49" class="number">5</text>
    <text x="75" y="49" class="heading">Layers and scan vectors</text>
    <text x="26" y="90" class="tool">PySLM · sections and exact audits</text>
    <text x="26" y="129" class="label">KEEP</text>
    <text x="26" y="156" class="body">Every layer and every scan vector</text>
    <text x="26" y="190" class="body">Audit whole segments and holes</text>
    <text x="26" y="216" class="body">Verify actual exposed contacts</text>
  </g>
  <path d="M525 690H497" class="flow"/>
  <g transform="translate(55 575)">
    <rect width="430" height="230" rx="17" class="card"/>
    <circle cx="39" cy="41" r="21" fill="#386b68"/><text x="39" y="49" class="number">6</text>
    <text x="75" y="49" class="heading">Manufacturing handover</text>
    <text x="26" y="90" class="tool">Offline guide · PDF · manifest</text>
    <text x="26" y="129" class="label">DELIVER</text>
    <text x="26" y="156" class="body">Drawings, CAD/STL, supports, layers</text>
    <text x="26" y="190" class="body">Results, settings and reproduction</text>
    <text x="26" y="216" class="body">Assign machine format and laser law</text>
  </g>
  <rect x="55" y="845" width="1390" height="61" rx="13" fill="#e4eeea"/>
  <text x="750" y="882" text-anchor="middle" font-size="23" fill="#386b68">After printing: workshop report → corrections → a controlled new revision</text>
  <text x="55" y="940" font-size="17" fill="#6a7c80">Workflow map · stage results remain in their own reports · current geometry snapshot: 18 October 2026</text>
</svg>
