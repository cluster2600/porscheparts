<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station PicoGK — Omniverse</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10171b; color: #e9f0f2; }
  body { margin: 0; }
  header { padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; border-bottom: 1px solid #3a4d55; }
  h1 { font-size: 17px; margin: 0; }
  form { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 13px; }
  input, button { font: inherit; padding: 8px; border: 1px solid #627983; border-radius: 4px; }
  input { width: 150px; }
  input[type=number] { width: 95px; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 3px solid #b8e87c; outline-offset: 2px; }
  #status { flex-basis: 100%; font-size: 14px; }
  main { background: black; height: calc(100vh - 155px); min-height: 280px; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; }
  footer { padding: 9px 20px; color: #bfccd1; font-size: 13px; }
</style>
<header>
  <h1>Station PicoGK · Omniverse</h1>
  <form id="connection">
    <label>Adresse IP média <input id="media-host" required placeholder="127.0.0.1" autocomplete="off"></label>
    <label>Port UDP média <input id="media-port" required type="number" min="1" max="65535" placeholder="47998"></label>
    <button id="connect">Connecter</button>
    <button id="disconnect" type="button" disabled>Déconnecter</button>
    <button id="evidence" type="button">Exporter le diagnostic</button>
  </form>
  <div id="status" role="status" aria-live="polite">Ouvrir le tunnel SSH de signalisation. Avec le relais média SSH : 127.0.0.1, port 47998. En accès direct : IP publique et port UDP Vast.</div>
</header>
<main aria-label="Éditeur Omniverse diffusé depuis la station">
  <video id="remote-video" autoplay playsinline muted tabindex="0" aria-label="Éditeur Omniverse distant"></video>
  <audio id="remote-audio" autoplay></audio>
</main>
<footer>La scène est rendue sur la station. Sélection, déplacement et sauvegarde utilisent les outils natifs de l’éditeur Kit.</footer>
<script type="module" src="./main.js"></script>
</html>
