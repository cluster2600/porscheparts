[supervisord]
nodaemon=false
pidfile=/tmp/simready-supervisord.pid
logfile=/workspace/logs/simready-supervisord.log
childlogdir=/workspace/logs

[unix_http_server]
file=/tmp/simready-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/simready-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:ovrtx]
directory=/opt/content-agents/apps/ovrtx_rendering_api
command=/opt/content-agents/apps/ovrtx_rendering_api/docker-entrypoint.sh /opt/ovrtx-app/bin/python -m uvicorn service.main:app --host 127.0.0.1 --port 8001
user=renderer
environment=HOME="/home/renderer",XDG_CACHE_HOME="/home/renderer/.cache",PYTHONPATH="/opt/content-agents:/opt/content-agents/apps/ovrtx_rendering_api",WU_OVRTX_VENV_DIR="/opt/ovrtx-runtime",WU_OVRTX_AUTO_PROVISION="0"
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/workspace/logs/ovrtx.log
stderr_logfile=/workspace/logs/ovrtx.err.log

[program:material-agent]
directory=/opt/content-agents/apps/material_agent_service
command=/opt/material-agent/bin/python -m uvicorn service.main:app --host 127.0.0.1 --port 8100
user=agents
environment=HOME="/home/agents",PYTHONPATH="/opt/content-agents:/opt/content-agents/apps:/opt/content-agents/apps/material_agent_service",RENDER_ENDPOINT="http://127.0.0.1:8001",MA_RENDERING_USE_DATA_URI="true",MA_VLM_BACKEND="nim",MA_VLM_MODEL="google/gemma-4-31b-it",MA_LLM_BACKEND="nim",MA_LLM_MODEL="google/gemma-4-31b-it",MA_STORAGE_KIND="local",MA_SESSION_STORAGE_PATH="/var/material-agent/sessions",MA_MAX_ACTIVE_SESSIONS="1",MA_MAX_RENDER_NUM_WORKERS="1"
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/workspace/logs/material-agent.log
stderr_logfile=/workspace/logs/material-agent.err.log

[program:physics-agent]
directory=/opt/content-agents/apps/physics_agent_service
command=/opt/physics-agent/bin/python -m uvicorn service.main:app --host 127.0.0.1 --port 8200
user=agents
environment=HOME="/home/agents",PYTHONPATH="/opt/content-agents:/opt/content-agents/apps:/opt/content-agents/apps/physics_agent_service",WU_OVPHYSX_VENV_DIR="/opt/ovphysx-runtime",RENDER_ENDPOINT="http://127.0.0.1:8001",PA_RENDER_BACKEND="remote",PA_SESSION_STORAGE_PATH="/var/physics-agent/sessions",PA_MAX_ACTIVE_SESSIONS="1",PA_MAX_WORKERS="12"
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/workspace/logs/physics-agent.log
stderr_logfile=/workspace/logs/physics-agent.err.log
