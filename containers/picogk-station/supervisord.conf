[unix_http_server]
file=/run/station-supervisor.sock
chmod=0600
[supervisord]
logfile=/workspace/logs/supervisor.log
pidfile=/run/station-supervisor.pid
childlogdir=/workspace/logs
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/station-supervisor.sock
[program:qwen]
command=/usr/local/bin/station-qwen
autostart=false
autorestart=unexpected
startsecs=30
startretries=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/qwen.log
stderr_logfile=/workspace/logs/qwen.err.log
[program:kit]
command=/usr/local/bin/station-kit
environment=STATION_KIT_GPU="2"
autostart=false
autorestart=unexpected
startsecs=30
startretries=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/kit.log
stderr_logfile=/workspace/logs/kit.err.log
[program:client]
command=/usr/bin/python3 -m http.server 8088 --bind 127.0.0.1 --directory /opt/station-client
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/client.log
stderr_logfile=/workspace/logs/client.err.log
