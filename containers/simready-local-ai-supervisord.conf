[supervisord]
nodaemon=false
pidfile=/tmp/simready-supervisord.pid
logfile=/workspace/logs/simready-supervisord.log
childlogdir=/workspace/logs

[unix_http_server]
file=/tmp/simready-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/simready-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:local-vlm]
command=/opt/local-ai/bin/vllm serve /opt/models/qwen2.5-vl-7b-instruct --served-model-name Qwen/Qwen2.5-VL-7B-Instruct --host 127.0.0.1 --port 8000 --dtype bfloat16 --max-model-len 32768 --gpu-memory-utilization 0.40 --max-num-seqs 2 --trust-remote-code --limit-mm-per-prompt image=20 --enforce-eager
user=root
environment=HOME="/root",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
autostart=true
autorestart=unexpected
startsecs=10
stdout_logfile=/workspace/logs/local-vlm.log
stderr_logfile=/workspace/logs/local-vlm.err.log

[program:ovrtx]
directory=/opt/content-agents/apps/ovrtx_rendering_api
command=/opt/content-agents/apps/ovrtx_rendering_api/docker-entrypoint.sh /opt/ovrtx-app/bin/python -m uvicorn service.main:app --host 127.0.0.1 --port 8001
user=renderer
environment=HOME="/home/renderer",XDG_CACHE_HOME="/home/renderer/.cache",PYTHONPATH="/opt/content-agents:/opt/content-agents/apps/ovrtx_rendering_api",WU_OVRTX_VENV_DIR="/opt/ovrtx-runtime",WU_OVRTX_AUTO_PROVISION="0"
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/workspace/logs/ovrtx.log
stderr_logfile=/workspace/logs/ovrtx.err.log

[program:material-agent]
directory=/opt/content-agents/apps/material_agent_service
command=/opt/material-agent/bin/python -m uvicorn service.main:app --host 127.0.0.1 --port 8100
user=agents
environment=HOME="/home/agents",PYTHONPATH="/opt/content-agents:/opt/content-agents/apps:/opt/content-agents/apps/material_agent_service",RENDER_ENDPOINT="http://127.0.0.1:8001",MA_RENDERING_USE_DATA_URI="true",MA_VLM_BACKEND="nim",MA_VLM_MODEL="Qwen/Qwen2.5-VL-7B-Instruct",MA_VLM_NIM_BASE_URL="http://127.0.0.1:8000/v1",MA_LLM_BACKEND="nim",MA_LLM_MODEL="Qwen/Qwen2.5-VL-7B-Instruct",MA_LLM_NIM_BASE_URL="http://127.0.0.1:8000/v1",MA_NIM_API_KEY="not-used",MA_STORAGE_KIND="local",MA_SESSION_STORAGE_PATH="/var/material-agent/sessions",MA_MAX_ACTIVE_SESSIONS="1",MA_MAX_RENDER_NUM_WORKERS="1"
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/workspace/logs/material-agent.log
stderr_logfile=/workspace/logs/material-agent.err.log

[program:physics-agent]
directory=/opt/content-agents/apps/physics_agent_service
command=/opt/physics-agent/bin/python -m uvicorn service.main:app --host 127.0.0.1 --port 8200
user=agents
environment=HOME="/home/agents",PYTHONPATH="/opt/content-agents:/opt/content-agents/apps:/opt/content-agents/apps/physics_agent_service",WU_OVPHYSX_VENV_DIR="/opt/ovphysx-runtime",RENDER_ENDPOINT="http://127.0.0.1:8001",PA_RENDER_BACKEND="remote",PA_VLM_BACKEND="nim",PA_VLM_MODEL="Qwen/Qwen2.5-VL-7B-Instruct",PA_VLM_NIM_BASE_URL="http://127.0.0.1:8000/v1",PA_NIM_API_KEY="not-used",PA_SESSION_STORAGE_PATH="/var/physics-agent/sessions",PA_MAX_ACTIVE_SESSIONS="1",PA_MAX_WORKERS="12"
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/workspace/logs/physics-agent.log
stderr_logfile=/workspace/logs/physics-agent.err.log
