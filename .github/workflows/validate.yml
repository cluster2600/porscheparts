name: Validate catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Cold checkout, the full test suite and pinned image pulls exceed 10 minutes.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-check.txt

      - name: Validate repository
        # The test runner writes skips per reason to the job summary and fails
        # when they exceed tests/skip-budget.json (issue #418).
        env:
          SKIP_BUDGET_ENFORCE: "1"
        run: make check
