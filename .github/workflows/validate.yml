name: Validate catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Cold checkout, the full test suite and pinned image pulls exceed 10 minutes.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native geometry and rendering libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libegl1 libegl-mesa0

      - name: Install numerical test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-check.txt

      - name: Install pinned native geometry oracle
        run: >-
          python -m pip --isolated install --disable-pip-version-check
          --index-url https://pypi.org/simple --no-deps --only-binary=:all:
          --require-hashes --keyring-provider disabled
          -r requirements-check-oracle.txt

      - name: Validate repository
        # The test runner writes skips per reason to the job summary and fails
        # when they exceed tests/skip-budget.json (issue #418).
        env:
          SKIP_BUDGET_ENFORCE: "1"
        run: make check

  cad-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa
      - name: Install isolated CAD dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-check-cad.txt
      - name: Check native CAD runtime
        run: |
          python -m pip check
          python -c "import cadquery as cq; assert abs(cq.Workplane('XY').box(2, 3, 4).val().Volume() - 24) < 1e-10"
      - name: Run CAD and STEP integrity regressions
        run: |
          python -m unittest discover -s tests -p 'test_m64_g*.py' -v
          python -m unittest discover -s tests -p 'test_cad_recode_fresh.py' -v

  usd-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated native USD SDK
        run: |
          curl --fail --silent --show-error --location --retry 3 https://conda.anaconda.org/conda-forge/linux-64/micromamba-2.10.0-0.tar.bz2 -o "$RUNNER_TEMP/micromamba.tar.bz2"
          echo "9a97976244929bbae28fb1fae504e74a3e7e6d1932870e3a03321f01b7fbd07b  $RUNNER_TEMP/micromamba.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/micromamba.tar.bz2" -C "$RUNNER_TEMP" bin/micromamba
          MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba" "$RUNNER_TEMP/bin/micromamba" --no-rc create -y -p "$RUNNER_TEMP/usd" --file requirements-check-usd-linux-64.txt
          echo "$RUNNER_TEMP/usd/bin" >> "$GITHUB_PATH"
      - name: Check native USD and shader registry
        run: |
          usdchecker --help
          python -c "import numpy, pyvista; from pxr import Usd, Sdr; assert Usd.GetVersion() == (0, 26, 8); assert Sdr.Registry().GetShaderNodeByIdentifier('UsdPreviewSurface')"
      - name: Run bundle and framing regressions
        run: |
          python -m unittest discover -s tests -p 'test_964_omniverse_bundle.py' -v
          python -m unittest discover -s tests -p 'test_964_review_framing.py' -v

  carrier-pyslm:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
      - name: Install both pinned PySLM generations
        run: |
          python -c "import platform; assert platform.system() == 'Darwin' and platform.machine() == 'arm64'"
          for generation in process-20261016 process-coverage-20261016; do
            python "parts/993-eng-carrier-0001/source/$generation/setup_pyslm.py" "$RUNNER_TEMP/$generation"
          done
      - name: Run historical generation regressions
        run: >-
          "$RUNNER_TEMP/process-20261016/env/bin/python" -B -m unittest
          discover -s tests -p 'test_carrier_process_20261016.py' -v
      - name: Run carrier coverage regressions
        # The historical generation above has a different pinned patch.
        run: |
          tests=()
          for path in tests/test_carrier*.py; do
            if [[ "$path" != tests/test_carrier_process_20261016.py ]]; then
              module="${path##*/}"
              tests+=("${module%.py}")
            fi
          done
          PYTHONPATH="$PWD/tests" "$RUNNER_TEMP/process-coverage-20261016/env/bin/python" -B -m unittest -v "${tests[@]}"

  free-tools-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENMDAO_REPORTS: "0"
      DVC_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the existing frozen free-tools environment
        run: python -m pip install -r benchmarks/free-tools/requirements.lock.txt
      - name: Check native Python dependencies
        run: |
          python -m pip check
          python -c "import dvc, openmdao.api, openturns"
      - name: Run synthetic storage and study controls
        run: python -m unittest discover -s tests -p 'test_free_tools.py' -v

  carrier-cad:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: arm64
      - name: Install and verify the frozen carrier CAD base
        run: >-
          python parts/993-eng-carrier-0001/source/design-20261016/setup_cad_base.py
          --python "$(command -v python)" --output "$RUNNER_TEMP/carrier-cad"
      - name: Add Gmsh and revalidate the pinned CAD base
        run: |
          "$RUNNER_TEMP/carrier-cad/bin/python" -m pip install --no-deps gmsh==4.15.2
          "$RUNNER_TEMP/carrier-cad/bin/python" -m pip check
          python parts/993-eng-carrier-0001/source/design-20261016/setup_cad_base.py --validate-only --python "$RUNNER_TEMP/carrier-cad/bin/python" --output "$RUNNER_TEMP/carrier-cad-post-gmsh"
          "$RUNNER_TEMP/carrier-cad/bin/python" -c "import gmsh; assert gmsh.__version__ == '4.15.2'"
      - name: Run native root-blend and CAD-section controls
        run: >-
          "$RUNNER_TEMP/carrier-cad/bin/python" -B -m unittest
          discover -s tests -p 'test_carrier_root*.py' -v

  warp-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the retained hash-pinned Warp runtime
        run: |
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r containers/warp-geometry.requirements.txt
          python -m pip check
          python -c "from importlib.metadata import version; import warp, numpy; assert version('warp-lang') == '1.18.0'; assert numpy.__version__ == '2.2.6'"
      - name: Run native CPU dispatch and independent oracle tests
        run: python -m unittest discover -s tests -p 'test_warp_geometry_pilot.py' -v

  cycle-thermal-f33:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Replay the exact F33 image
        run: make 917-cycle-thermal-f33-test
