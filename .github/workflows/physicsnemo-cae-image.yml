name: Build PhysicsNeMo CAE image

on:
  workflow_dispatch:
    inputs:
      push:
        description: Publier l'image candidate sur GHCR
        required: true
        default: true
        type: boolean
      verify_anonymous:
        description: Exiger une lecture anonyme du digest GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/3dprinting993-physicsnemo-cae-cu12

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable linux/amd64 candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/physicsnemo-cae-cu12.Dockerfile
          platforms: linux/amd64
          load: ${{ !inputs.push }}
          push: ${{ inputs.push }}
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=physicsnemo-cae-cu12
          cache-to: type=gha,mode=max,scope=physicsnemo-cae-cu12

      - name: Smoke local candidate without network
        if: ${{ !inputs.push }}
        run: |
          docker run --rm --network none \
            "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            | tee physicsnemo-cae-smoke.json
          jq -e '.status == "passed" and .offline_smoke == true' \
            physicsnemo-cae-smoke.json >/dev/null
          printf '%s\n' "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            > physicsnemo-cae-image-ref.txt

      - name: Pull, inspect and smoke the published digest
        if: inputs.push
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          pinned_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          docker pull "${pinned_ref}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${pinned_ref}")" = linux/amd64
          docker buildx imagetools inspect --raw "${pinned_ref}" \
            | jq -e '
                (.mediaType == "application/vnd.docker.distribution.manifest.v2+json") and
                (([.layers[].size] | max) < 5000000000) and
                (([.layers[].size] | add) < 30000000000)
              ' >/dev/null
          docker run --rm --network none "${pinned_ref}" \
            | tee physicsnemo-cae-smoke.json
          jq -e '.status == "passed" and .offline_smoke == true' \
            physicsnemo-cae-smoke.json >/dev/null
          printf '%s\n' "${pinned_ref}" > physicsnemo-cae-image-ref.txt

      - name: Verify anonymous access to the exact digest
        if: inputs.push && inputs.verify_anonymous
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "${anonymous_config}"' EXIT
          DOCKER_CONFIG="${anonymous_config}" docker buildx imagetools inspect --raw \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >/dev/null

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@v4
        with:
          name: physicsnemo-cae-cu12-${{ github.sha }}
          path: |
            physicsnemo-cae-smoke.json
            physicsnemo-cae-image-ref.txt
          if-no-files-found: error
          retention-days: 30
