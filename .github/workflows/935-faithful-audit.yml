name: 935 faithful scan audit

on:
  pull_request:
    paths:
      - scripts/audit_935_faithful_scan.py
      - scripts/render_935_scan_audit.py
      - scripts/935-faithful-requirements.txt
      - tests/test_935_faithful_scan.py
      - .github/workflows/935-faithful-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r scripts/935-faithful-requirements.txt
      - name: Require the audit dependencies and run synthetic geometry tests
        run: |
          python -c "import numpy, scipy, trimesh, rtree, matplotlib"
          python -m unittest discover -s tests -p test_935_faithful_scan.py -v
