name: Build CAD author F28 image

# Declenchement manuel uniquement. Le workflow ne recoit jamais de scan, de
# modele moteur, de STEP de projet, de dataset ou de poids de modele.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Publier l'image candidate sur GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/3dprinting993-cad-author-f28

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify pinned Buildx and BuildKit
        run: |
          docker buildx version 2>&1 | tee cad-author-f28-builder.txt
          docker buildx inspect --bootstrap 2>&1 | tee -a cad-author-f28-builder.txt
          grep -F 'v0.36.1' cad-author-f28-builder.txt >/dev/null
          grep -F 'v0.32.2' cad-author-f28-builder.txt >/dev/null
          buildx_path="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "buildx"}}{{.Path}}{{end}}{{end}}')"
          test -x "${buildx_path}"
          test "$(sha256sum "${buildx_path}" | cut -d' ' -f1)" = "48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778"
          sha256sum "${buildx_path}" | tee -a cad-author-f28-builder.txt
          buildkit_container_ids="$(docker ps --filter name=buildx_buildkit --format '{{.ID}}')"
          test "$(printf '%s\n' "${buildkit_container_ids}" | grep -c .)" -eq 1
          buildkit_image="$(docker container inspect --format '{{.Config.Image}}' "${buildkit_container_ids}")"
          test "${buildkit_image}" = "moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8"
          printf 'BuildKit image: %s\n' "${buildkit_image}" | tee -a cad-author-f28-builder.txt

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 candidate with attestations
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: containers/cad-author-f28.Dockerfile
          platforms: linux/amd64
          load: ${{ !inputs.push }}
          push: ${{ inputs.push }}
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=cad-author-f28

      - name: Smoke local candidate in an isolated runtime
        if: ${{ !inputs.push }}
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REPOSITORY}:${GITHUB_SHA}")" = linux/amd64
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE_REPOSITORY}:${GITHUB_SHA}")" = 9178:9178
          if ! docker run --rm --platform linux/amd64 --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges \
            "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            > cad-author-f28-smoke.json \
            2> cad-author-f28-smoke.stderr; then
            cat cad-author-f28-smoke.json
            cat cad-author-f28-smoke.stderr >&2
            exit 1
          fi
          cat cad-author-f28-smoke.json
          cat cad-author-f28-smoke.stderr >&2
          test ! -s cad-author-f28-smoke.stderr
          jq -e '
            .status == "passed_synthetic_cad_fixture_only" and
            .offline == true and .non_root == true and .gpu == false and
            .platform == "linux/amd64-cpu" and .runtime_uid_gid == "9178:9178" and
            .build123d == "0.11.1" and .ocp == "7.9.3.1" and
            .network_isolation_evidence.verified == true and
            (.network_isolation_evidence.external_routed_interfaces | length) == 0 and
            .bundled_content_audit.contains_scan_or_engine_geometry == false and
            .bundled_content_audit.contains_model_weights == false and
            (.bundled_content_audit.forbidden_asset_files | length) == 0 and
            (.bundled_content_audit.secret_named_files | length) == 0 and
            .dependency_audit.pin_count == 46 and
            .dependency_audit.hash_count == 46 and
            .dependency_audit.system_package_hash_count == 11 and
            .dependency_audit.versions.build123d == "0.11.1" and
            .dependency_audit.versions["cadquery-ocp-novtk"] == "7.9.3.1.1" and
            .runtime_identity_and_cache_audit.account == "cad-author" and
            .runtime_identity_and_cache_audit.passwd_home == "/tmp" and
            .runtime_identity_and_cache_audit.home_environment == "/tmp" and
            .runtime_identity_and_cache_audit.xdg_cache_home == "/tmp/cad-author-f28-cache" and
            .runtime_identity_and_cache_audit.cache_write_probe == true and
            .fontconfig_audit.config_present == true and
            .fontconfig_audit.system_font_file_count == 0 and
            .font_payload_audit.dependency_font_file_count == 1 and
            .font_payload_audit.dependency_font_files_sha256["build123d/data/fonts/reliefsingleline/ReliefSingleLineCAD-Regular.ttf"] == "8b30ea7ea8a2b17fb9d5c70b5c7c37e6a9285b4f8aced4fbd646bc591dba59b3" and
            .font_payload_audit.text_geometry_validated == false and
            .license_audit.package_notice_count == 11 and
            (.license_audit.missing_package_notices | length) == 0 and
            .checks.created_shape.valid == true and
            .checks.created_shape.solid_count == 1 and
            .checks.created_shape.all_solids_closed == true and
            .checks.step_reopened_shape.valid == true and
            .checks.step_reopened_shape.solid_count == 1 and
            .checks.closed_solid_after_step_roundtrip == true and
            .checks.created_geometry_signature_repeatable == true and
            .checks.reopened_geometry_signature_repeatable == true and
            .checks.canonical_scan_used == false and
            .checks.vehicle_geometry_used == false and
            all(.release_gates[]; . == false)
          ' cad-author-f28-smoke.json >/dev/null
          jq '{license_audit, dependency_lock: .dependency_audit}' \
            cad-author-f28-smoke.json > cad-author-f28-license-audit.json
          size_archive_dir="$(mktemp -d)"
          trap 'rm -rf -- "${size_archive_dir}"' EXIT
          docker save "${IMAGE_REPOSITORY}:${GITHUB_SHA}" > "${size_archive_dir}/image.tar"
          local_store_bytes="$(docker image inspect --format '{{.Size}}' "${IMAGE_REPOSITORY}:${GITHUB_SHA}")"
          python3 containers/cad-author-f28-smoke.py \
            --measure-image-archive "${size_archive_dir}/image.tar" \
            --local-store-bytes "${local_store_bytes}" \
            > /tmp/cad-author-f28-local-size.json
          jq '{local_and_uncompressed: .}' \
            /tmp/cad-author-f28-local-size.json > cad-author-f28-size.json
          printf '%s\n' "${IMAGE_REPOSITORY}:${GITHUB_SHA}" > cad-author-f28-image-ref.txt

      - name: Upload local candidate evidence
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cad-author-f28-local-${{ github.sha }}
          path: |
            cad-author-f28-image-ref.txt
            cad-author-f28-builder.txt
            cad-author-f28-license-audit.json
            cad-author-f28-size.json
            cad-author-f28-smoke.json
            cad-author-f28-smoke.stderr
          if-no-files-found: error
          retention-days: 30

      - name: Gate published image by exact digest, subject, provenance and SBOM
        if: inputs.push
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag_ref="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          pinned_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          tag_digest=""
          for attempt in 1 2 3 4 5; do
            tag_digest="$(docker buildx imagetools inspect "${tag_ref}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }')"
            if test "${tag_digest}" = "${IMAGE_DIGEST}"; then break; fi
            sleep 3
          done
          test "${tag_digest}" = "${IMAGE_DIGEST}"

          docker buildx imagetools inspect --raw "${pinned_ref}" > cad-author-f28-index.json
          test "$(sha256sum cad-author-f28-index.json | cut -d' ' -f1)" = "${IMAGE_DIGEST#sha256:}"
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | length) == 2 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
            ([.manifests[] | select(.platform.os == "unknown" and .platform.architecture == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 1
          ' cad-author-f28-index.json >/dev/null
          platform_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' cad-author-f28-index.json)"
          attestation_digest="$(jq -er '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' cad-author-f28-index.json)"
          test "$(jq -er '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .annotations["vnd.docker.reference.digest"]' cad-author-f28-index.json)" = "${platform_digest}"

          docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}@${platform_digest}" > cad-author-f28-platform-manifest.json
          test "$(sha256sum cad-author-f28-platform-manifest.json | cut -d' ' -f1)" = "${platform_digest#sha256:}"
          jq -e 'all(.layers[]; .mediaType == "application/vnd.oci.image.layer.v1.tar+gzip") and ([.layers[].size] | max) < 275000000 and ([.layers[].size] | add) < 325000000' cad-author-f28-platform-manifest.json >/dev/null
          jq '{registry_compressed:{metric_scope:"compressed_oci_registry_blobs", layer_media_type:"application/vnd.oci.image.layer.v1.tar+gzip", compressed_layer_max_bytes:([.layers[].size] | max), compressed_layers_total_bytes:([.layers[].size] | add), budgets:{compressed_layer_max_bytes:275000000, compressed_layers_total_bytes:325000000}}}' \
            cad-author-f28-platform-manifest.json > cad-author-f28-size.json

          docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}@${attestation_digest}" > cad-author-f28-attestation-manifest.json
          test "$(sha256sum cad-author-f28-attestation-manifest.json | cut -d' ' -f1)" = "${attestation_digest#sha256:}"
          jq -e --arg subject "${platform_digest}" '
            .artifactType == "application/vnd.docker.attestation.manifest.v1+json" and
            .subject.mediaType == "application/vnd.oci.image.manifest.v1+json" and
            .subject.digest == $subject and
            ([.layers[] | select(.mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1")] | length) == 1 and
            ([.layers[] | select(.mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")] | length) == 1
          ' cad-author-f28-attestation-manifest.json >/dev/null

          docker buildx imagetools inspect --format '{{json .Provenance}}' "${pinned_ref}" > cad-author-f28-provenance.json
          jq -e \
            --arg source "https://github.com/${GITHUB_REPOSITORY}" \
            --arg revision "${GITHUB_SHA}" \
            --arg builder_prefix "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/" '
            (.SLSA.buildDefinition.buildType | startswith("https://github.com/moby/buildkit/")) and
            .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:source"] == $source and
            .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:revision"] == $revision and
            .SLSA.buildDefinition.internalParameters.github_repository == env.GITHUB_REPOSITORY and
            .SLSA.buildDefinition.internalParameters.github_workflow_sha == $revision and
            (.SLSA.runDetails.builder.id | startswith($builder_prefix)) and
            any(.SLSA.buildDefinition.resolvedDependencies[]; .digest.sha256 == "a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e") and
            any(.SLSA.buildDefinition.resolvedDependencies[]; .digest.sha256 == "9c47360a2a0355e2da18516d0b1c2126ec22c195d2185e97347c9d98398c5bef")
          ' cad-author-f28-provenance.json >/dev/null

          docker buildx imagetools inspect --format '{{json .SBOM}}' "${pinned_ref}" > cad-author-f28-sbom.json
          jq -e '
            (if .SPDX then .SPDX elif type == "array" then .[0].SPDX else null end) as $spdx |
            $spdx.spdxVersion == "SPDX-2.3" and
            $spdx.SPDXID == "SPDXRef-DOCUMENT" and
            $spdx.dataLicense == "CC0-1.0" and
            ($spdx.packages | type == "array" and length > 0) and
            any($spdx.packages[]; ((.name // "") | ascii_downcase) == "build123d" and .versionInfo == "0.11.1") and
            any($spdx.packages[]; ((.name // "") | ascii_downcase) == "cadquery-ocp-novtk" and .versionInfo == "7.9.3.1.1")
          ' cad-author-f28-sbom.json >/dev/null

          docker pull --platform linux/amd64 "${pinned_ref}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${pinned_ref}")" = linux/amd64
          test "$(docker image inspect --format '{{.Config.User}}' "${pinned_ref}")" = 9178:9178
          size_archive_dir="$(mktemp -d)"
          trap 'rm -rf -- "${size_archive_dir}"' EXIT
          docker save "${pinned_ref}" > "${size_archive_dir}/image.tar"
          local_store_bytes="$(docker image inspect --format '{{.Size}}' "${pinned_ref}")"
          python3 containers/cad-author-f28-smoke.py \
            --measure-image-archive "${size_archive_dir}/image.tar" \
            --local-store-bytes "${local_store_bytes}" \
            > /tmp/cad-author-f28-local-size.json
          jq -s '{registry_compressed: .[0].registry_compressed, local_and_uncompressed: .[1]}' \
            cad-author-f28-size.json /tmp/cad-author-f28-local-size.json \
            > cad-author-f28-size.tmp.json
          mv cad-author-f28-size.tmp.json cad-author-f28-size.json
          if ! docker run --rm --platform linux/amd64 --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges \
            "${pinned_ref}" \
            > cad-author-f28-smoke.json \
            2> cad-author-f28-smoke.stderr; then
            cat cad-author-f28-smoke.json
            cat cad-author-f28-smoke.stderr >&2
            exit 1
          fi
          cat cad-author-f28-smoke.json
          cat cad-author-f28-smoke.stderr >&2
          test ! -s cad-author-f28-smoke.stderr
          jq -e '
            .status == "passed_synthetic_cad_fixture_only" and
            .offline == true and .non_root == true and .gpu == false and
            .platform == "linux/amd64-cpu" and .runtime_uid_gid == "9178:9178" and
            .build123d == "0.11.1" and .ocp == "7.9.3.1" and
            .network_isolation_evidence.verified == true and
            (.network_isolation_evidence.external_routed_interfaces | length) == 0 and
            .bundled_content_audit.contains_scan_or_engine_geometry == false and
            .bundled_content_audit.contains_model_weights == false and
            (.bundled_content_audit.forbidden_asset_files | length) == 0 and
            (.bundled_content_audit.secret_named_files | length) == 0 and
            .dependency_audit.pin_count == 46 and
            .dependency_audit.hash_count == 46 and
            .dependency_audit.system_package_hash_count == 11 and
            .dependency_audit.versions.build123d == "0.11.1" and
            .dependency_audit.versions["cadquery-ocp-novtk"] == "7.9.3.1.1" and
            .runtime_identity_and_cache_audit.account == "cad-author" and
            .runtime_identity_and_cache_audit.passwd_home == "/tmp" and
            .runtime_identity_and_cache_audit.home_environment == "/tmp" and
            .runtime_identity_and_cache_audit.xdg_cache_home == "/tmp/cad-author-f28-cache" and
            .runtime_identity_and_cache_audit.cache_write_probe == true and
            .fontconfig_audit.config_present == true and
            .fontconfig_audit.system_font_file_count == 0 and
            .font_payload_audit.dependency_font_file_count == 1 and
            .font_payload_audit.dependency_font_files_sha256["build123d/data/fonts/reliefsingleline/ReliefSingleLineCAD-Regular.ttf"] == "8b30ea7ea8a2b17fb9d5c70b5c7c37e6a9285b4f8aced4fbd646bc591dba59b3" and
            .font_payload_audit.text_geometry_validated == false and
            .license_audit.package_notice_count == 11 and
            (.license_audit.missing_package_notices | length) == 0 and
            .checks.created_shape.valid == true and
            .checks.created_shape.solid_count == 1 and
            .checks.created_shape.all_solids_closed == true and
            .checks.step_reopened_shape.valid == true and
            .checks.step_reopened_shape.solid_count == 1 and
            .checks.closed_solid_after_step_roundtrip == true and
            .checks.created_geometry_signature_repeatable == true and
            .checks.reopened_geometry_signature_repeatable == true and
            .checks.canonical_scan_used == false and
            .checks.vehicle_geometry_used == false and
            all(.release_gates[]; . == false)
          ' cad-author-f28-smoke.json >/dev/null
          jq '{license_audit, dependency_lock: .dependency_audit}' \
            cad-author-f28-smoke.json > cad-author-f28-license-audit.json
          printf '%s\n' "${pinned_ref}" > cad-author-f28-image-ref.txt

      - name: Require anonymous access to the published exact digest
        if: inputs.push
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf -- "${anonymous_config}"' EXIT
          pinned_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          DOCKER_CONFIG="${anonymous_config}" docker pull --platform linux/amd64 "${pinned_ref}"
          if ! DOCKER_CONFIG="${anonymous_config}" docker run --rm --platform linux/amd64 \
            --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges \
            "${pinned_ref}" \
            > cad-author-f28-anonymous-smoke.json \
            2> cad-author-f28-anonymous-smoke.stderr; then
            cat cad-author-f28-anonymous-smoke.json
            cat cad-author-f28-anonymous-smoke.stderr >&2
            exit 1
          fi
          cat cad-author-f28-anonymous-smoke.json
          cat cad-author-f28-anonymous-smoke.stderr >&2
          test ! -s cad-author-f28-anonymous-smoke.stderr
          jq -e '
            .status == "passed_synthetic_cad_fixture_only" and
            .offline == true and .non_root == true and .gpu == false and
            .platform == "linux/amd64-cpu" and .runtime_uid_gid == "9178:9178" and
            .build123d == "0.11.1" and .ocp == "7.9.3.1" and
            .network_isolation_evidence.verified == true and
            (.network_isolation_evidence.external_routed_interfaces | length) == 0 and
            .bundled_content_audit.contains_scan_or_engine_geometry == false and
            .bundled_content_audit.contains_model_weights == false and
            (.bundled_content_audit.forbidden_asset_files | length) == 0 and
            (.bundled_content_audit.secret_named_files | length) == 0 and
            .dependency_audit.pin_count == 46 and
            .dependency_audit.hash_count == 46 and
            .dependency_audit.system_package_hash_count == 11 and
            .dependency_audit.versions.build123d == "0.11.1" and
            .dependency_audit.versions["cadquery-ocp-novtk"] == "7.9.3.1.1" and
            .runtime_identity_and_cache_audit.account == "cad-author" and
            .runtime_identity_and_cache_audit.passwd_home == "/tmp" and
            .runtime_identity_and_cache_audit.home_environment == "/tmp" and
            .runtime_identity_and_cache_audit.xdg_cache_home == "/tmp/cad-author-f28-cache" and
            .runtime_identity_and_cache_audit.cache_write_probe == true and
            .fontconfig_audit.config_present == true and
            .fontconfig_audit.system_font_file_count == 0 and
            .font_payload_audit.dependency_font_file_count == 1 and
            .font_payload_audit.dependency_font_files_sha256["build123d/data/fonts/reliefsingleline/ReliefSingleLineCAD-Regular.ttf"] == "8b30ea7ea8a2b17fb9d5c70b5c7c37e6a9285b4f8aced4fbd646bc591dba59b3" and
            .font_payload_audit.text_geometry_validated == false and
            .license_audit.package_notice_count == 11 and
            (.license_audit.missing_package_notices | length) == 0 and
            .checks.created_shape.valid == true and
            .checks.created_shape.solid_count == 1 and
            .checks.created_shape.all_solids_closed == true and
            .checks.step_reopened_shape.valid == true and
            .checks.step_reopened_shape.solid_count == 1 and
            .checks.closed_solid_after_step_roundtrip == true and
            .checks.created_geometry_signature_repeatable == true and
            .checks.reopened_geometry_signature_repeatable == true and
            .checks.canonical_scan_used == false and
            .checks.vehicle_geometry_used == false and
            all(.release_gates[]; . == false)
          ' cad-author-f28-anonymous-smoke.json >/dev/null

      - name: Upload published digest evidence
        if: inputs.push
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cad-author-f28-published-${{ github.sha }}
          path: |
            cad-author-f28-image-ref.txt
            cad-author-f28-builder.txt
            cad-author-f28-index.json
            cad-author-f28-platform-manifest.json
            cad-author-f28-attestation-manifest.json
            cad-author-f28-anonymous-smoke.json
            cad-author-f28-anonymous-smoke.stderr
            cad-author-f28-license-audit.json
            cad-author-f28-provenance.json
            cad-author-f28-sbom.json
            cad-author-f28-size.json
            cad-author-f28-smoke.json
            cad-author-f28-smoke.stderr
          if-no-files-found: error
          retention-days: 30
