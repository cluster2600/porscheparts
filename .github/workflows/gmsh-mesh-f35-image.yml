name: Build Gmsh mesh F35 image

# Publication manuelle uniquement. Le contexte Docker contient seulement la
# recette, les deux verrous de dependances et le smoke OCC synthetique.
on:
  workflow_dispatch:
    inputs:
      confirm_gmsh_source_compliance:
        description: Confirme la revue GPL et l'acces au code source correspondant de Gmsh
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: gmsh-mesh-f35-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/3dprinting993-gmsh-mesh-f35

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify main release source
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${{ inputs.confirm_gmsh_source_compliance }}" = "true"

      - name: Verify fail-closed lock and static image guards
        run: |
          set -o pipefail
          {
            python3 tests/test_gmsh_mesh_f35_image.py -v
            python3 tests/test_gmsh_mesh_f35_lock.py -v
          } 2>&1 | tee gmsh-mesh-f35-static-tests.txt

      - name: Record exact public image inputs
        run: |
          sha256sum \
            .github/workflows/gmsh-mesh-f35-image.yml \
            containers/gmsh-mesh-f35.Dockerfile \
            containers/gmsh-mesh-f35.Dockerfile.dockerignore \
            containers/gmsh-mesh-f35.requirements.txt \
            containers/gmsh-mesh-f35-system-packages.sha256 \
            containers/gmsh-mesh-f35-smoke.py \
            containers/gmsh-mesh-f35.lock.json \
            tests/test_gmsh_mesh_f35_image.py \
            tests/test_gmsh_mesh_f35_lock.py \
            > gmsh-mesh-f35-source-inputs.sha256

      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify pinned Buildx and BuildKit
        run: |
          docker buildx version 2>&1 | tee gmsh-mesh-f35-builder.txt
          docker buildx inspect --bootstrap 2>&1 | tee -a gmsh-mesh-f35-builder.txt
          grep -F 'v0.36.1' gmsh-mesh-f35-builder.txt >/dev/null
          grep -F 'v0.32.2' gmsh-mesh-f35-builder.txt >/dev/null
          buildx_path="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "buildx"}}{{.Path}}{{end}}{{end}}')"
          test -x "${buildx_path}"
          test "$(sha256sum "${buildx_path}" | cut -d' ' -f1)" = "48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778"
          sha256sum "${buildx_path}" | tee -a gmsh-mesh-f35-builder.txt
          buildkit_container_ids="$(docker ps --filter name=buildx_buildkit --format '{{.ID}}')"
          test "$(printf '%s\n' "${buildkit_container_ids}" | grep -c .)" -eq 1
          buildkit_image="$(docker container inspect --format '{{.Config.Image}}' "${buildkit_container_ids}")"
          test "${buildkit_image}" = "moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8"
          printf 'BuildKit image: %s\n' "${buildkit_image}" | tee -a gmsh-mesh-f35-builder.txt

      - name: Log in to GHCR for candidate publication
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 candidate with attestations
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: containers/gmsh-mesh-f35.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REPOSITORY }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gmsh-mesh-f35
          cache-to: type=gha,mode=max,scope=gmsh-mesh-f35

      - name: Gate exact digest, attestations, SBOM and hardened smoke
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag_ref="${IMAGE_REPOSITORY}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pinned_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          tag_digest=""
          for attempt in 1 2 3 4 5; do
            tag_digest="$(docker buildx imagetools inspect "${tag_ref}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }')"
            if test "${tag_digest}" = "${IMAGE_DIGEST}"; then break; fi
            sleep 3
          done
          test "${tag_digest}" = "${IMAGE_DIGEST}"

          docker buildx imagetools inspect --raw "${pinned_ref}" > gmsh-mesh-f35-index.json
          test "$(sha256sum gmsh-mesh-f35-index.json | cut -d' ' -f1)" = "${IMAGE_DIGEST#sha256:}"
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | length) == 2 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
            ([.manifests[] | select(.platform.os == "unknown" and .platform.architecture == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 1
          ' gmsh-mesh-f35-index.json >/dev/null
          platform_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' gmsh-mesh-f35-index.json)"
          attestation_digest="$(jq -er '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' gmsh-mesh-f35-index.json)"
          test "$(jq -er '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .annotations["vnd.docker.reference.digest"]' gmsh-mesh-f35-index.json)" = "${platform_digest}"

          docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}@${platform_digest}" > gmsh-mesh-f35-platform-manifest.json
          test "$(sha256sum gmsh-mesh-f35-platform-manifest.json | cut -d' ' -f1)" = "${platform_digest#sha256:}"
          jq -e '
            .mediaType == "application/vnd.oci.image.manifest.v1+json" and
            all(.layers[]; .mediaType == "application/vnd.oci.image.layer.v1.tar+gzip") and
            ([.layers[].size] | add) < 250000000
          ' gmsh-mesh-f35-platform-manifest.json >/dev/null

          docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}@${attestation_digest}" > gmsh-mesh-f35-attestation-manifest.json
          test "$(sha256sum gmsh-mesh-f35-attestation-manifest.json | cut -d' ' -f1)" = "${attestation_digest#sha256:}"
          jq -e --arg subject "${platform_digest}" '
            .artifactType == "application/vnd.docker.attestation.manifest.v1+json" and
            .subject.mediaType == "application/vnd.oci.image.manifest.v1+json" and
            .subject.digest == $subject and
            ([.layers[] | select(.mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1")] | length) == 1 and
            ([.layers[] | select(.mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")] | length) == 1
          ' gmsh-mesh-f35-attestation-manifest.json >/dev/null

          docker buildx imagetools inspect --format '{{json .Provenance}}' "${pinned_ref}" > gmsh-mesh-f35-provenance.json
          jq -e \
            --arg source "https://github.com/${GITHUB_REPOSITORY}" \
            --arg revision "${GITHUB_SHA}" \
            --arg builder_prefix "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/" '
            (.SLSA.buildDefinition.buildType | startswith("https://github.com/moby/buildkit/")) and
            .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:source"] == $source and
            .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:revision"] == $revision and
            .SLSA.buildDefinition.internalParameters.github_repository == env.GITHUB_REPOSITORY and
            .SLSA.buildDefinition.internalParameters.github_workflow_sha == $revision and
            (.SLSA.runDetails.builder.id | startswith($builder_prefix)) and
            any(.SLSA.buildDefinition.resolvedDependencies[]; .digest.sha256 == "a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e") and
            any(.SLSA.buildDefinition.resolvedDependencies[]; .digest.sha256 == "9c47360a2a0355e2da18516d0b1c2126ec22c195d2185e97347c9d98398c5bef")
          ' gmsh-mesh-f35-provenance.json >/dev/null

          docker buildx imagetools inspect --format '{{json .SBOM}}' "${pinned_ref}" > gmsh-mesh-f35-sbom.json
          jq -e '
            (if .SPDX then .SPDX elif type == "array" then .[0].SPDX else null end) as $spdx |
            $spdx.spdxVersion == "SPDX-2.3" and
            $spdx.SPDXID == "SPDXRef-DOCUMENT" and
            $spdx.dataLicense == "CC0-1.0" and
            any($spdx.packages[]; ((.name // "") | ascii_downcase) == "gmsh" and .versionInfo == "4.15.2")
          ' gmsh-mesh-f35-sbom.json >/dev/null

          docker pull --platform linux/amd64 "${pinned_ref}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${pinned_ref}")" = linux/amd64
          test "$(docker image inspect --format '{{.Config.User}}' "${pinned_ref}")" = 9135:9135
          if ! docker run --rm --platform linux/amd64 --user 9135:9135 \
            --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges \
            "${pinned_ref}" > gmsh-mesh-f35-smoke.json 2> gmsh-mesh-f35-smoke.stderr; then
            cat gmsh-mesh-f35-smoke.json
            cat gmsh-mesh-f35-smoke.stderr >&2
            exit 1
          fi
          test ! -s gmsh-mesh-f35-smoke.stderr
          jq -e '
            .status == "passed_synthetic_occ_volume_mesh_only" and
            .claim_scope == "synthetic_occ_volume_mesh_only" and
            .porsche_geometry_used == false and
            .engine_geometry_verified == false and
            .physics_simulation_verified == false and
            .fitment_verified == false and
            .fabrication_authorized == false and
            .mesh.gmsh_version == "4.15.2" and
            .runtime.gmsh_api_version == "4.15.2" and
            .runtime.libgmsh_sha256 == "9db3090d3b720c57b76bcbfa01d13854823ae2698c91343c20bdd4c2b81f6317" and
            .runtime.resolved_elf_dependencies == true and
            .runtime.runtime_uid == 9135 and .runtime.runtime_gid == 9135 and
            .mesh.node_count > 0 and .mesh.element_count_3d > 0 and
            .mesh.minimum_jacobian_positive == true and
            .mesh.minimum_det_jac_positive == true and
            .mesh.minimum_sicn_positive == true and
            .mesh.physical_groups == ["fluid_volume", "inlet", "outlet", "wall"] and
            all(.physical_release_gates[]; . == false)
          ' gmsh-mesh-f35-smoke.json >/dev/null
          printf '%s\n' "${pinned_ref}" > gmsh-mesh-f35-image-ref.txt

          docker logout ghcr.io
          docker image rm -f "${pinned_ref}" >/dev/null
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf -- "${anonymous_config}"' EXIT
          printf '{"auths":{}}\n' > "${anonymous_config}/config.json"
          DOCKER_CONFIG="${anonymous_config}" docker pull --platform linux/amd64 "${pinned_ref}" \
            2>&1 | tee gmsh-mesh-f35-anonymous-pull.txt
          jq -e '.auths == {}' "${anonymous_config}/config.json" >/dev/null
          test "$(docker image inspect --format '{{.RepoDigests}}' "${pinned_ref}" | grep -o "${IMAGE_DIGEST}" | head -1)" = "${IMAGE_DIGEST}"
          if ! docker run --rm --platform linux/amd64 --user 9135:9135 \
            --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges \
            "${pinned_ref}" > gmsh-mesh-f35-anonymous-smoke.json 2> gmsh-mesh-f35-anonymous-smoke.stderr; then
            cat gmsh-mesh-f35-anonymous-smoke.json
            cat gmsh-mesh-f35-anonymous-smoke.stderr >&2
            exit 1
          fi
          test ! -s gmsh-mesh-f35-anonymous-smoke.stderr
          jq -S '{status,claim_scope,porsche_geometry_used,engine_geometry_verified,physics_simulation_verified,fitment_verified,fabrication_authorized,runtime,physical_release_gates,mesh:{gmsh_version:.mesh.gmsh_version,minimum_jacobian_positive:.mesh.minimum_jacobian_positive,minimum_det_jac_positive:.mesh.minimum_det_jac_positive,minimum_sicn_positive:.mesh.minimum_sicn_positive,physical_groups:.mesh.physical_groups}}' gmsh-mesh-f35-smoke.json > /tmp/gmsh-mesh-f35-smoke-stable.json
          jq -S '{status,claim_scope,porsche_geometry_used,engine_geometry_verified,physics_simulation_verified,fitment_verified,fabrication_authorized,runtime,physical_release_gates,mesh:{gmsh_version:.mesh.gmsh_version,minimum_jacobian_positive:.mesh.minimum_jacobian_positive,minimum_det_jac_positive:.mesh.minimum_det_jac_positive,minimum_sicn_positive:.mesh.minimum_sicn_positive,physical_groups:.mesh.physical_groups}}' gmsh-mesh-f35-anonymous-smoke.json > /tmp/gmsh-mesh-f35-anonymous-smoke-stable.json
          cmp /tmp/gmsh-mesh-f35-smoke-stable.json /tmp/gmsh-mesh-f35-anonymous-smoke-stable.json
          jq -n --arg image_ref "${pinned_ref}" --arg docker_config_sha256 "$(sha256sum "${anonymous_config}/config.json" | cut -d' ' -f1)" \
            '{anonymous_pull_verified:true,image_ref:$image_ref,docker_config_auths:0,docker_config_sha256:$docker_config_sha256}' \
            > gmsh-mesh-f35-anonymous-audit.json

      - name: Log in to GHCR for verified tag promotion
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified digest to unique tag
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          candidate_ref="${IMAGE_REPOSITORY}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pinned_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          release_ref="${IMAGE_REPOSITORY}:verified-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(docker buildx imagetools inspect "${candidate_ref}" | awk '$1 == "Digest:" { print $2; exit }')" = "${IMAGE_DIGEST}"
          docker buildx imagetools create --tag "${release_ref}" "${pinned_ref}"
          release_digest=""
          for attempt in 1 2 3 4 5; do
            release_digest="$(docker buildx imagetools inspect "${release_ref}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }')"
            if test "${release_digest}" = "${IMAGE_DIGEST}"; then break; fi
            sleep 3
          done
          test "${release_digest}" = "${IMAGE_DIGEST}"
          printf '%s\n' "${candidate_ref}" > gmsh-mesh-f35-candidate-tag.txt
          printf '%s\n' "${release_ref}" > gmsh-mesh-f35-release-tag.txt
          docker logout ghcr.io

      - name: Upload immutable image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gmsh-mesh-f35-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gmsh-mesh-f35-image-ref.txt
            gmsh-mesh-f35-candidate-tag.txt
            gmsh-mesh-f35-release-tag.txt
            gmsh-mesh-f35-source-inputs.sha256
            gmsh-mesh-f35-static-tests.txt
            gmsh-mesh-f35-builder.txt
            gmsh-mesh-f35-index.json
            gmsh-mesh-f35-platform-manifest.json
            gmsh-mesh-f35-attestation-manifest.json
            gmsh-mesh-f35-provenance.json
            gmsh-mesh-f35-sbom.json
            gmsh-mesh-f35-smoke.json
            gmsh-mesh-f35-smoke.stderr
            gmsh-mesh-f35-anonymous-pull.txt
            gmsh-mesh-f35-anonymous-smoke.json
            gmsh-mesh-f35-anonymous-smoke.stderr
            gmsh-mesh-f35-anonymous-audit.json
          if-no-files-found: error
          retention-days: 30
