name: Build compute images

# Manual only: these images are large and slow to build, and they change far
# less often than the catalogue.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which image to build"
        required: true
        default: cadsim
        type: choice
        options: [cadsim, recon, mesh-cfd, physicsml, simready, simready-workflow, simready-local-ai, both]
      push:
        description: "Push to ghcr.io"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        image: [cadsim, recon, mesh-cfd, physicsml, simready, simready-workflow, simready-local-ai]
    steps:
      - name: Skip images not requested
        id: gate
        run: |
          if [ "${{ inputs.image }}" = "both" ] || [ "${{ inputs.image }}" = "${{ matrix.image }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      # A CUDA build fills the default runner disk; drop the preinstalled
      # toolchains the job does not use.
      - name: Reclaim runner disk
        if: steps.gate.outputs.run == 'true' && (matrix.image == 'recon' || matrix.image == 'mesh-cfd' || matrix.image == 'physicsml' || matrix.image == 'simready' || matrix.image == 'simready-workflow' || matrix.image == 'simready-local-ai')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.gate.outputs.run == 'true' && inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ matrix.image }}.Dockerfile
          load: ${{ !inputs.push }}
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Smoke test the image
        if: steps.gate.outputs.run == 'true' && !inputs.push
        run: |
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:${{ github.sha }} \
            smoke-test.sh ${{ matrix.image }}

      - name: Pull and smoke test the published image
        if: steps.gate.outputs.run == 'true' && inputs.push
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:${{ github.sha }}
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:${{ github.sha }} \
            smoke-test.sh ${{ matrix.image }}
