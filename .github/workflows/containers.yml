name: Build compute images

# Manual only: these images are large and slow to build, and they change far
# less often than the catalogue.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which image to build"
        required: true
        default: cadsim
        type: choice
        options: [cadsim, recon, mesh-cfd, physicsml, simready, simready-workflow, simready-local-ai, both]
      push:
        description: "Push to ghcr.io"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        image: [cadsim, recon, mesh-cfd, physicsml, simready, simready-workflow, simready-local-ai]
    concurrency:
      group: container-publication-${{ matrix.image }}
      cancel-in-progress: false
    steps:
      - name: Skip images not requested
        id: gate
        run: |
          if [ "${{ inputs.image }}" = "both" ] || [ "${{ inputs.image }}" = "${{ matrix.image }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop Docker before enlarging its storage
        if: steps.gate.outputs.run == 'true' && matrix.image == 'simready-local-ai'
        run: sudo systemctl stop docker.socket docker

      - name: Maximize local AI build storage
        if: steps.gate.outputs.run == 'true' && matrix.image == 'simready-local-ai'
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          build-mount-path: /var/lib/docker
          build-mount-path-ownership: root:root
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Restart Docker on enlarged storage
        if: steps.gate.outputs.run == 'true' && matrix.image == 'simready-local-ai'
        run: |
          # Bound dockerd/embedded BuildKit Go scheduling and its soft heap
          # target so the Actions listener keeps headroom while exporting the
          # 30+ GB image on the public 4-vCPU/16-GiB runner.
          sudo systemctl set-environment GOMAXPROCS=3 GOMEMLIMIT=12GiB
          sudo systemctl start docker
          docker info >/dev/null
          df -h / /var/lib/docker

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      # A CUDA build fills the default runner disk; drop the preinstalled
      # toolchains the job does not use.
      - name: Reclaim runner disk
        if: steps.gate.outputs.run == 'true' && (matrix.image == 'recon' || matrix.image == 'mesh-cfd' || matrix.image == 'physicsml' || matrix.image == 'simready' || matrix.image == 'simready-workflow')
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          sudo rm -rf /opt/microsoft /usr/local/lib/heroku /usr/local/share/powershell
          docker system prune --all --force --volumes
          df -h /

      - name: Set up Buildx
        if: steps.gate.outputs.run == 'true' && matrix.image != 'simready-local-ai'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.gate.outputs.run == 'true' && (inputs.push || matrix.image == 'simready-local-ai')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: standard_build
        if: steps.gate.outputs.run == 'true' && matrix.image != 'simready-local-ai'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          load: ${{ !inputs.push }}
          push: ${{ inputs.push }}
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      # Pull the pinned amd64 base into the enlarged Docker store with bounded
      # backoff before assembling the large local-AI image.
      - name: Preload local AI base images
        if: steps.gate.outputs.run == 'true' && matrix.image == 'simready-local-ai'
        run: |
          mapfile -t base_images < <(
            awk '$1 == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--platform=/) { print $i; break } }' \
              containers/simready-local-ai.Dockerfile
          )
          for image_ref in "${base_images[@]}"; do
            pulled=false
            for attempt in 1 2 3 4 5; do
              if docker pull "$image_ref"; then
                pulled=true
                break
              fi
              sleep "$((attempt * 30))"
            done
            if [ "$pulled" != true ]; then
              echo "Failed to pull $image_ref after 5 attempts" >&2
              exit 1
            fi
          done

      - name: Build large local AI image from Docker store
        id: local_ai_build
        if: steps.gate.outputs.run == 'true' && matrix.image == 'simready-local-ai'
        run: |
          set -euo pipefail
          repository=ghcr.io/${{ github.repository_owner }}/3dprinting993-simready-local-ai
          output_flag=--load
          cache_args=(--cache-from "type=registry,ref=${repository}:latest")
          if [ "${{ inputs.push }}" = "true" ]; then
            output_flag=--push
            # Inline cache metadata adds no duplicate image layers and lets the
            # next ephemeral runner reuse linked model-shard layers.
            cache_args+=(--build-arg BUILDKIT_INLINE_CACHE=1)
          fi
          metadata_file="${RUNNER_TEMP}/simready-local-ai-build-metadata.json"
          rm -f -- "$metadata_file"
          docker buildx build \
            --builder default \
            "$output_flag" \
            "${cache_args[@]}" \
            --platform linux/amd64 \
            --provenance=false \
            --metadata-file "$metadata_file" \
            --file containers/simready-local-ai.Dockerfile \
            --tag "${repository}:${{ github.sha }}" \
            .
          if [ "${{ inputs.push }}" = "true" ]; then
            digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve published immutable digest
        id: published_image
        if: steps.gate.outputs.run == 'true' && inputs.push
        run: |
          set -euo pipefail
          digest='${{ steps.standard_build.outputs.digest }}'
          if [ "${{ matrix.image }}" = simready-local-ai ]; then
            digest='${{ steps.local_ai_build.outputs.digest }}'
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository=ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}
          pinned_ref="${repository}@${digest}"
          platform="$(docker buildx imagetools inspect \
            --format '{{.Image.OS}}/{{.Image.Architecture}}' "$pinned_ref")"
          test "$platform" = linux/amd64
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published local AI manifest limits
        if: steps.gate.outputs.run == 'true' && matrix.image == 'simready-local-ai' && inputs.push
        run: |
          repository=ghcr.io/${{ github.repository_owner }}/3dprinting993-simready-local-ai
          digest='${{ steps.published_image.outputs.digest }}'
          pinned_ref="${repository}@${digest}"
          docker buildx imagetools inspect --raw "$pinned_ref" \
            | jq -e '
                ((.mediaType == "application/vnd.docker.distribution.manifest.v2+json") or
                 (.mediaType == "application/vnd.oci.image.manifest.v1+json")) and
                (([.layers[].size] | max) < 5000000000) and
                (([.layers[].size] | add) < 45000000000)
              ' >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test the image
        if: steps.gate.outputs.run == 'true' && !inputs.push
        run: |
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:${{ github.sha }} \
            smoke-test.sh ${{ matrix.image }}

      - name: Verify anonymous digest pull
        id: public_manifest
        if: steps.gate.outputs.run == 'true' && inputs.push
        run: |
          set -euo pipefail
          repository=ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}
          digest='${{ steps.published_image.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          pinned_image="${repository}@${digest}"
          docker image rm -f \
            "${repository}:${{ github.sha }}" "$pinned_image" >/dev/null 2>&1 || true
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          ! docker image inspect "$pinned_image" >/dev/null 2>&1
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "${anonymous_config}"' EXIT
          printf '{}\n' > "${anonymous_config}/config.json"
          DOCKER_CONFIG="${anonymous_config}" docker buildx imagetools inspect --raw \
            "${pinned_image}" >/dev/null
          DOCKER_CONFIG="${anonymous_config}" docker pull --platform linux/amd64 \
            "${pinned_image}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "$pinned_image")" = linux/amd64
          DOCKER_CONFIG="${anonymous_config}" docker run --rm \
            "$pinned_image" smoke-test.sh ${{ matrix.image }}
          if [[ "${{ matrix.image }}" =~ ^simready($|-workflow$|-local-ai$) ]]; then
            DOCKER_CONFIG="${anonymous_config}" docker run --rm \
              --entrypoint /usr/local/bin/simready-sshd-runtime-smoke \
              "$pinned_image"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Promote verified image
        if: steps.gate.outputs.run == 'true' && inputs.push
        run: |
          expected_digest=${{ steps.public_manifest.outputs.digest }}
          docker buildx imagetools create \
            --prefer-index=false \
            --tag ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:latest \
            ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}@${expected_digest}
          latest_digest="$(docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/3dprinting993-${{ matrix.image }}:latest \
            | awk '$1 == "Digest:" { print $2; exit }')"
          test "$latest_digest" = "$expected_digest"
