name: Corpus preparation boundaries
on:
  pull_request:
    paths:
      - data-engineering/**
      - .github/workflows/corpus-data-engineering.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s data-engineering/porsche-corpus/tests -v
