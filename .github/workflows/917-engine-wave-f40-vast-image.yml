name: Build 917 engine wave F40 Vast image

on:
  push:
    branches:
      - main
      - codex/917-f40-unsteady-convergence
    paths:
      - .github/workflows/917-engine-wave-f40-vast-image.yml
      - containers/917-engine-wave-f40-vast/**
      - docs/917_VAST_WAVE_IMAGE_F40.md
      - tests/test_917_engine_wave_f40_vast_image.py
  workflow_dispatch:

concurrency:
  group: 917-engine-wave-f40-vast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Meme package GHCR public que F39, image et digest distincts. Cela permet
  # de fermer la gate de pull anonyme avant toute location Vast.
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/3dprinting993-wave-action-f39
  IMAGE_TAG: ${{ github.sha }}-vast-f40

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run static fail-closed guard
        run: python3 tests/test_917_engine_wave_f40_vast_image.py -v

      - name: Hash exact public inputs
        run: |
          sha256sum \
            .github/workflows/917-engine-wave-f40-vast-image.yml \
            containers/917-engine-wave-f40-vast/Dockerfile \
            containers/917-engine-wave-f40-vast/Dockerfile.dockerignore \
            containers/917-engine-wave-f40-vast/lock.json \
            containers/917-engine-wave-f40-vast/system-packages.sha256 \
            containers/917-engine-wave-f40-vast/stage_job.py \
            containers/917-engine-wave-f40-vast/run_job.sh \
            containers/917-engine-wave-f40-vast/prepare_layout.sh \
            containers/917-engine-wave-f40-vast/image_smoke.py \
            containers/917-engine-wave-f40-vast/vast_onstart.sh \
            containers/917-engine-wave-f40-vast/entrypoint.sh \
            docs/917_VAST_WAVE_IMAGE_F40.md \
            tests/test_917_engine_wave_f40_vast_image.py \
            > 917-engine-wave-f40-vast-source-inputs.sha256

      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify pinned Buildx and BuildKit
        run: |
          docker buildx version 2>&1 | tee 917-engine-wave-f40-vast-builder.txt
          docker buildx inspect --bootstrap 2>&1 | tee -a 917-engine-wave-f40-vast-builder.txt
          grep -F 'v0.36.1' 917-engine-wave-f40-vast-builder.txt >/dev/null
          grep -F 'v0.32.2' 917-engine-wave-f40-vast-builder.txt >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 candidate with attestations
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: containers/917-engine-wave-f40-vast/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=917-engine-wave-f40-vast
          cache-to: type=gha,mode=max,scope=917-engine-wave-f40-vast

      - name: Gate digest, attestations and offline privilege separation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PINNED_REF: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "${PINNED_REF}" > 917-engine-wave-f40-vast-index.json
          test "$(sha256sum 917-engine-wave-f40-vast-index.json | cut -d' ' -f1)" = "${IMAGE_DIGEST#sha256:}"
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
            ([.manifests[] | select(.platform.os == "unknown" and .platform.architecture == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 1
          ' 917-engine-wave-f40-vast-index.json >/dev/null

          platform_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' 917-engine-wave-f40-vast-index.json)"
          docker buildx imagetools inspect --format '{{json .Provenance}}' "${PINNED_REF}" > 917-engine-wave-f40-vast-provenance.json
          docker buildx imagetools inspect --format '{{json .SBOM}}' "${PINNED_REF}" > 917-engine-wave-f40-vast-sbom.json
          jq -e '
            (if .SPDX then .SPDX elif type == "array" then .[0].SPDX else null end) as $spdx |
            $spdx.spdxVersion == "SPDX-2.3" and
            any($spdx.packages[]; ((.name // "") | ascii_downcase) == "aeolus1d" and .versionInfo == "0.3.3") and
            any($spdx.packages[]; ((.name // "") | ascii_downcase) == "openssh-server")
          ' 917-engine-wave-f40-vast-sbom.json >/dev/null

          docker pull --platform linux/amd64 "${PINNED_REF}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${PINNED_REF}")" = linux/amd64
          test "$(docker image inspect --format '{{.Config.User}}' "${PINNED_REF}")" = 0:0
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${PINNED_REF}")" = '["/opt/917-engine-wave-f40-vast/entrypoint.sh"]'

          docker run --rm --platform linux/amd64 --user 0:0 \
            --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --tmpfs /workspace:rw,exec,nosuid,nodev,size=256m \
            --tmpfs /run:rw,nosuid,nodev,size=32m \
            --pids-limit 128 --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add SETUID --cap-add SETGID --cap-add SETPCAP \
            --security-opt no-new-privileges \
            "${PINNED_REF}" \
            > 917-engine-wave-f40-vast-smoke.json \
            2> 917-engine-wave-f40-vast-smoke.stderr
          test ! -s 917-engine-wave-f40-vast-smoke.stderr
          jq -e '
            .status == "offline_transport_smoke_passed_vast_and_engine_validation_blocked" and
            .runtime.machine == "x86_64" and
            .runtime.transport_uid == 0 and
            .runtime.solver_uid == 9139 and
            .ssh_transport.sshd_packaged == true and
            .ssh_transport.sshd_started_by_image_smoke == false and
            .ssh_transport.baked_host_private_key_count == 0 and
            .solver_isolation.solver_effective_uid == 9139 and
            .solver_isolation.solver_no_new_privileges == true and
            .solver_isolation.aeolus1d == "0.3.3" and
            .claim_scope.vast_authorized_key_injection_verified == false and
            .claim_scope.vast_ssh_direct_handshake_verified == false and
            .claim_scope.f40_campaign_executed == false and
            .claim_scope.target_1600_mechanical_hp_proven == false and
            .claim_scope.engine_start_authorized == false and
            .claim_scope.manufacturing_authorized == false
          ' 917-engine-wave-f40-vast-smoke.json >/dev/null

          docker run --rm --platform linux/amd64 --user 9139:9139 \
            --network none --read-only \
            --env HOME=/tmp --env XDG_CACHE_HOME=/tmp/cache --env NUMBA_CACHE_DIR=/tmp/numba \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python "${PINNED_REF}" /opt/917-engine-wave-f39/smoke.py \
            > 917-engine-wave-f40-vast-solver-smoke.json \
            2> 917-engine-wave-f40-vast-solver-smoke.stderr
          test ! -s 917-engine-wave-f40-vast-solver-smoke.stderr
          jq -e '.runtime.uid == 9139 and .dependencies.aeolus1d == "0.3.3"' \
            917-engine-wave-f40-vast-solver-smoke.json >/dev/null
          printf '%s\n' "${PINNED_REF}" > 917-engine-wave-f40-vast-image-ref.txt
          printf '%s\n' "${platform_digest}" > 917-engine-wave-f40-vast-platform-digest.txt

      - name: Gate anonymous pull of the exact digest
        env:
          PINNED_REF: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          docker image rm -f "${PINNED_REF}" >/dev/null
          anonymous_config="$(mktemp -d)"
          printf '{}\n' > "${anonymous_config}/config.json"
          DOCKER_CONFIG="${anonymous_config}" docker pull --platform linux/amd64 "${PINNED_REF}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${PINNED_REF}")" = linux/amd64
          DOCKER_CONFIG="${anonymous_config}" docker run --rm --platform linux/amd64 --user 9139:9139 \
            --network none --read-only \
            --env HOME=/tmp --env XDG_CACHE_HOME=/tmp/cache --env NUMBA_CACHE_DIR=/tmp/numba \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python "${PINNED_REF}" /opt/917-engine-wave-f39/smoke.py \
            > 917-engine-wave-f40-vast-anonymous-smoke.json \
            2> 917-engine-wave-f40-vast-anonymous-smoke.stderr
          test ! -s 917-engine-wave-f40-vast-anonymous-smoke.stderr
          jq -e '.runtime.uid == 9139 and .dependencies.aeolus1d == "0.3.3"' \
            917-engine-wave-f40-vast-anonymous-smoke.json >/dev/null

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 917-engine-wave-f40-vast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            917-engine-wave-f40-vast-source-inputs.sha256
            917-engine-wave-f40-vast-builder.txt
            917-engine-wave-f40-vast-index.json
            917-engine-wave-f40-vast-provenance.json
            917-engine-wave-f40-vast-sbom.json
            917-engine-wave-f40-vast-smoke.json
            917-engine-wave-f40-vast-smoke.stderr
            917-engine-wave-f40-vast-solver-smoke.json
            917-engine-wave-f40-vast-solver-smoke.stderr
            917-engine-wave-f40-vast-anonymous-smoke.json
            917-engine-wave-f40-vast-anonymous-smoke.stderr
            917-engine-wave-f40-vast-image-ref.txt
            917-engine-wave-f40-vast-platform-digest.txt
          if-no-files-found: error
          retention-days: 30
