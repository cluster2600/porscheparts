name: New part
description: Propose a part to measure, reconstruct or manufacture
title: "[PART] "
labels: ["part-candidate"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload any manual, model or scan without an explicit redistribution licence.

  - type: input
    id: name
    attributes:
      label: Part name
    validations:
      required: true

  - type: input
    id: part-number
    attributes:
      label: Presumed Porsche part number
      description: Write "unknown" if it is not verified.
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: Need
      description: Why must the part be reproduced?
    validations:
      required: true

  - type: textarea
    id: fitment
    attributes:
      label: Variants and years
      description: State only what is confirmed and distinguish the unknowns.
    validations:
      required: true

  - type: dropdown
    id: safety
    attributes:
      label: Proposed safety class
      options:
        - prohibited_pending_engineering
        - non_critical
        - functional
        - safety_critical
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Sources and licences
      description: URL, author, licence and access date for each source.
    validations:
      required: true

  - type: textarea
    id: available-part
    attributes:
      label: Part or vehicle available for measurement
      description: Do not publish a VIN, address or personal data.

  - type: dropdown
    id: titanium
    attributes:
      label: Titanium candidate?
      options:
        - To be studied
        - No
        - Yes, with justification in the need
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Confirmation
      options:
        - label: I do not claim that a part is safe or compatible without documented evidence.
          required: true
        - label: I hold the necessary rights to the files I will propose.
          required: true
