name: Safety issue
description: Report a risk or evidence contradicting a part's status
title: "[SAFETY] "
labels: ["safety", "needs-review"]
body:
  - type: input
    id: part-id
    attributes:
      label: Affected part
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Observed risk
      description: Do not publish personal data or proprietary documents.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction method
    validations:
      required: true

  - type: dropdown
    id: immediate-action
    attributes:
      label: Proposed precautionary action
      options:
        - Downgrade the part to prohibited_pending_engineering
        - Suspend only one variant or process
        - Review required before decision
    validations:
      required: true
