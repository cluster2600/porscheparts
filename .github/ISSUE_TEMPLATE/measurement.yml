name: Measurement campaign
description: Organise the measurement or scan of a candidate part
title: "[MEASURE] "
labels: ["measurement"]
body:
  - type: input
    id: part-id
    attributes:
      label: Part identifier or issue
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Dimensions or surfaces sought
    validations:
      required: true

  - type: textarea
    id: equipment
    attributes:
      label: Available instruments
      description: Calliper, micrometer, scanner, camera, gauges.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Datums and scaling method
    validations:
      required: true

  - type: textarea
    id: outputs
    attributes:
      label: Expected deliverables
      description: Measurement table, photos, point cloud, mesh, uncertainty report.
    validations:
      required: true
